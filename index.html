const cardDueEff = (c, ym) => cardDue(c, ym) || Core.fromDn(Core.pd(`${ym}-${pad(Math.min(28, Math.max(1, c.closeDay || 1)))}`) + 7);
const isPaid = (ym, key) => !!((S.paid || {})[ym] || {})[key];
// limite usado = fatura fechada ainda não paga + fatura aberta + parcelas que já vão cair nas próximas faturas
function cardLimitInfo(c) {
  if (!(c.limit > 0)) return null;
  const open = openFatYm(c), closed = Core.addM(open, -1);
  let used = Math.max(0, M.aPagarForCard(open, c.id));
  if (!isPaid(closed, 'c:' + c.id) && TODAY <= cardDueEff(c, closed)) used += Math.max(0, M.aPagarForCard(closed, c.id));
  for (let k = 1; k <= 40; k++) { const ym = Core.addM(open, k); used += sum(M.installmentsForCard(ym, c.id), x => x.v - Math.min(M.advOf(ym, x.t.id), x.v)); }
  return { limit: c.limit, used, free: c.limit - used, pct: used / c.limit };
}

  for (let k = 1; k <= 40; k++) { const ym = Core.addM(open, k); rows.push({ ym, v: sum(M.installmentsForCard(ym, c.id), x => x.v) }); }
  while (rows.length && rows[rows.length - 1].v <= 0.004) rows.pop();

}

// S.accounts = [{ id, name, color, init, since, sinceUid? }] (opcional; vazio ou ausente = recurso desligado).
// init = saldo informado na data since (YYYY-MM-DD). A primeira conta é a padrão: lançamentos sem conta (ou com uma conta
// que não existe mais) caem nela. sinceUid (opcional) = S.uid no momento em que o saldo foi informado com a data de hoje:
// lançamentos desse mesmo dia criados depois disso também contam no saldo.
// Ligações: tx.acc (entradas e Pix/débito), ap.acc (aportes), f.acc (itens fixos fora do cartão), c.payAcc (conta que paga a fatura).
// Transferência: { id, d, t:'tr', v, from, to, desc, cat:'Transferência', pay:'conta', par:1 } — não é entrada nem saída.
const accList = () => (S && Array.isArray(S.accounts) ? S.accounts : []);

const ACC_TONES = ['teal', 'navy', 'tan', 'forest', 'purple', 'wine', 'orange', 'graphite'];
function accPal(a) {
  const i = Math.max(0, accList().indexOf(a));
  return CARD_COLORS.find(x => x[0] === (a && a.color)) || CARD_COLORS.find(x => x[0] === ACC_TONES[i % ACC_TONES.length]) || CARD_COLORS[0];
}
const accVars = a => { const q = accPal(a); return `--g1:${q[2]};--g2:${q[3]};--g3:${q[4]}`; };

const cxIsJuros = name => S.cx.some(c => c.mode === 'juros' && Core.key(c.name) === Core.key(name || ''));
// aporte que mexe na conta: realocação, dinheiro de terceiros e a caixinha do item fixo de juros (já sai pelo item fixo) ficam de fora
const apMovesAcc = a => !!a.res || (!a.re && !a.ext && !cxIsJuros(a.cx));
const apCash = a => a.res ? -a.res.net : a.v; // quanto saiu (+) ou voltou (−) para a conta: na retirada, o líquido
const txInAcc = (t, id) => t.t === 'tr' ? accIdOf(t.from) === id || accIdOf(t.to) === id : (t.t === 'in' || (t.t === 'out' && t.pay === 'conta')) && accIdOf(t.acc) === id;

function cxOutTip(sim, at) {

    const opts = [];
    if (p.iofR > 0) opts.push({ dn: p.d + 30, save: p.iof, what: 'o IOF zera' });
    const nx = p.dias <= 180 ? 181 : p.dias <= 360 ? 361 : p.dias <= 720 ? 721 : 0;
    if (nx && p.irR > 0) { const nr = M.irRate(nx); opts.push({ dn: p.d + nx, save: (p.irR - nr) * (p.rend - p.iof), what: `o IR cai para ${pct1(nr)}` }); }

  }
  if (!best) return '';
  return `<div class="outtip">${icon('calendar', 14)} Se esperar até ${dmy(Core.fromDn(best.dn))}, ${best.what} e você paga cerca de ${brl(best.save)} a menos.</div>`;

// Fonte: brapi.dev (https://brapi.dev/api/quote/TICKER?token=...), com Access-Control-Allow-Origin: *
// (fetch() direto do navegador). Token do plano gratuito, compartilhado por todos os usuários

const BRAPI_TOKEN = 'oYQkMxsS6KJVtneypk4QJT';
let invQBusy = false, invQResult = null; // resultado da última tentativa automática (não é salvo)
function fmtWhen(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const dIso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  return (dIso === TODAY ? 'hoje' : `${dmy(dIso)}/${dIso.slice(0, 4)}`) + ` às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function invQuoteStatus() {
  const list = S.inv.assets.filter(a => a.qAt);
  if (!list.length) return 'Nenhuma cotação foi atualizada automaticamente ou colada ainda: os preços abaixo são os que você digitou.';
  const last = list.reduce((m, a) => a.qAt > m.qAt ? a : m, list[0]);
  return `Última atualização (${last.qSrc === 'auto' ? 'automática' : 'colada'}): ${last.ticker} ${fmtWhen(last.qAt)}. ${list.length} de ${S.inv.assets.length} ativo(s) têm cotação automática ou colada.`;
}
function invQResultHtml() {
  if (!invQResult || !invQResult.fail.length) return '';

}
async function fetchQuote(ticker) {
  const tk = String(ticker || '').trim().toUpperCase();
  if (!tk) return { ok: false, msg: 'ticker vazio' };
  let res;
  try { res = await fetch(`https://brapi.dev/api/quote/${encodeURIComponent(tk)}?token=${BRAPI_TOKEN}`); }
  catch (e) { return { ok: false, msg: 'falha de rede' }; }
  let data = null; try { data = await res.json(); } catch (e) { }
  if (!res.ok) return { ok: false, msg: res.status === 404 ? 'ticker não encontrado' : res.status === 401 || res.status === 402 || res.status === 429 ? 'limite da API atingido, tente mais tarde' : ((data && data.message) || `erro ${res.status}`) };
  const price = data && data.results && data.results[0] && data.results[0].regularMarketPrice;
  if (!(price > 0)) return { ok: false, msg: 'sem cotação disponível' };
  return { ok: true, price: Core.round2(price) };
}
ACT.invqauto = async () => {
  if (invQBusy) return;
  const tickers = uniq(S.inv.assets.map(a => (a.ticker || '').trim().toUpperCase()).filter(Boolean));
  if (!tickers.length) { toast('Nenhum ativo cadastrado ainda.'); return; }
  invQBusy = true; invQResult = null; render();
  // uma consulta por vez: a brapi recusa várias simultâneas no plano gratuito
  const results = [];
  for (const tk of tickers) {
    let r = await fetchQuote(tk);
    if (!r.ok && r.msg === 'falha de rede') { await new Promise(ok => setTimeout(ok, 800)); r = await fetchQuote(tk); }
    results.push({ tk, r });
  }
  invQBusy = false;
  const ok = results.filter(x => x.r.ok), fail = results.filter(x => !x.r.ok);
  invQResult = { fail: fail.map(x => ({ tk: x.tk, msg: x.r.msg })) };
  if (!ok.length) { render(); toast('Não consegui atualizar nenhuma cotação agora. Use “Colar cotações”.'); return; }
  const now = new Date().toISOString();
  commit(S => {
    ok.forEach(({ tk, r }) => { S.inv.assets.filter(a => (a.ticker || '').trim().toUpperCase() === tk).forEach(a => { a.price = r.price; a.qAt = now; a.qSrc = 'auto'; }); });
  }, `${ok.length} de ${tickers.length} cotação(ões) atualizada(s) automaticamente${fail.length ? '. Veja abaixo os que falharam.' : ''}`);
};
function parsePastedPrice(raw) {
  const m = String(raw || '').replace(/R\$/gi, ' ').match(/\d[\d.,]*/);
  if (!m) return NaN;
  let t = m[0];
  t = t.includes(',') && t.includes('.') ? t.replace(/\./g, '').replace(',', '.') : t.replace(',', '.');
  const n = parseFloat(t);
  return isFinite(n) ? n : NaN;
}
function parseQuotePaste(text) {
  const byTicker = new Map();
  String(text || '').split(/\r?\n/).forEach(line => {
    const l = line.trim(); if (!l) return;
    const m = l.match(/^([A-Za-z0-9]{3,8})(?:\.[A-Za-z]{2,3})?[\s:;-]+(.+)$/);
    if (!m) return;
    const price = parsePastedPrice(m[2]);
    if (price > 0) byTicker.set(m[1].toUpperCase(), price);
  });
  return byTicker;
}

// ---------- importar extrato (OFX/CSV) ----------
// Tudo roda no navegador (FileReader) — nada é enviado para fora. IMP guarda o estado do fluxo em andamento.
let IMP = null;
ACT.impstart = () => {
  IMP = null;
  openInfo('Importar extrato', `<p class="mut">Selecione o arquivo do extrato exportado do banco: OFX (a maioria dos bancos) ou CSV. A leitura acontece aqui no navegador, nada é enviado para fora.</p>
    <div class="fld"><label class="fl">Arquivo (.ofx, .csv ou .txt)</label><input type="file" class="in" accept=".ofx,.csv,.txt" onchange="impPickFile(this.files[0])"></div>`, () => ACT.dados());
};
function impPickFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { impHandleText(file.name || '', String(reader.result || '').replace(/^\uFEFF/, '')); }
    catch (e) { openInfo('Importar extrato', '<p class="mut">Não consegui processar esse arquivo. Confira se é um extrato OFX ou CSV exportado do banco.</p>', () => ACT.impstart()); }
  };
  reader.onerror = () => openInfo('Importar extrato', '<p class="mut">Não consegui ler esse arquivo.</p>', () => ACT.impstart());
  reader.readAsText(file);
}
function impNum(str) {
  let s = String(str == null ? '' : str).trim().replace(/^R\$\s*/i, '').replace(/\s/g, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s[0] === '-') { neg = true; s = s.slice(1); } else if (s[0] === '+') { s = s.slice(1); }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); // formato BR: ponto = milhar, vírgula = decimal
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
function impDate(str) {
  const s = String(str || '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) { const d = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`; return isNaN(new Date(d).getTime()) ? '' : d; }
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) { let [, d, mo, y] = m; if (y.length === 2) y = (+y > 50 ? '19' : '20') + y; const iso = `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`; return isNaN(new Date(iso).getTime()) ? '' : iso; }
  return '';
}
function impParseOFX(text) {
  const rows = [];
  const isCC = /<CCSTMTRS|<CREDITCARDMSGSRSV1|<CCACCTFROM/i.test(text);
  const blocks = text.split(/<STMTTRN>/i).slice(1);
  for (const raw of blocks) {
    const block = raw.split(/<\/STMTTRN>/i)[0];
    const get = tag => { const m = block.match(new RegExp('<' + tag + '>\\s*([^\\r\\n<]*)', 'i')); return m ? m[1].trim() : ''; };
    const d = impDate(get('DTPOSTED').slice(0, 8).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
    const v = impNum(get('TRNAMT'));
    if (!d || !isFinite(v) || Math.abs(v) < 0.005) continue;
    const memo = get('MEMO') || get('NAME') || get('PAYEE') || (v < 0 ? 'Saída' : 'Entrada');
    rows.push({ d, t: v < 0 ? 'out' : 'in', v: Math.round(Math.abs(v) * 100) / 100, desc: memo, pay: isCC ? 'cartao' : 'conta' });
  }
  return rows;
}
function impSplitCSVLine(line, delim) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function impParseCSV(text) {
  const lines = text.split(/\r\n|\r|\n/).filter(l => l.trim() !== '');
  if (!lines.length) return null;
  const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const table = lines.map(l => impSplitCSVLine(l, delim));
  const hasHeader = !table[0].some(c => impDate(c)); // uma linha de dados real sempre tem uma célula com data válida
  const labels = hasHeader ? table[0] : table[0].map((_, i) => 'Coluna ' + (i + 1));
  const dataRows = hasHeader ? table.slice(1) : table;
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const findCol = names => labels.findIndex(h => names.some(n => norm(h).includes(n)));
  return { labels, dataRows, iDate: findCol(['data']), iDesc: findCol(['descri', 'histor', 'memo', 'lancamento', 'nome', 'detalh']), iVal: findCol(['valor', 'montante', 'vlr']) };
}
function impBuildCSVRows(csv, iDate, iDesc, iVal, defPay) {
  const rows = [];
  for (const cols of csv.dataRows) {
    const d = impDate(cols[iDate]), v = impNum(cols[iVal]);
    if (!d || !isFinite(v) || Math.abs(v) < 0.005) continue;
    rows.push({ d, t: v < 0 ? 'out' : 'in', v: Math.round(Math.abs(v) * 100) / 100, desc: (cols[iDesc] || '').trim() || 'Lançamento', pay: defPay });
  }
  return rows;
}
function impHandleText(name, text) {
  const isOfx = /\.ofx$/i.test(name) || /<STMTTRN>/i.test(text);
  const isCC = /cart[aã]o|credit/i.test(name);
  if (isOfx) {
    const rows = impParseOFX(text);
    if (!rows.length) { openInfo('Importar extrato', '<p class="mut">Não encontrei lançamentos nesse arquivo OFX. Confira se é um extrato exportado do banco.</p>', () => ACT.impstart()); return; }
    impStartReview(rows);
    return;
  }
  const csv = impParseCSV(text);
  if (!csv || !csv.dataRows.length) { openInfo('Importar extrato', '<p class="mut">Não consegui ler esse arquivo como CSV. Confira o formato exportado do banco.</p>', () => ACT.impstart()); return; }
  if (csv.iDate >= 0 && csv.iDesc >= 0 && csv.iVal >= 0) {
    const rows = impBuildCSVRows(csv, csv.iDate, csv.iDesc, csv.iVal, isCC ? 'cartao' : 'conta');
    if (rows.length) { impStartReview(rows); return; }
  }

// ---------- nuvem (Supabase): cada conta guarda seu próprio estado, isolado por login ----------
// localStorage continua sendo o cache local (funciona offline); a nuvem sincroniza por cima,
// salvando o mesmo JSON numa linha só do usuário logado (protegida por Row Level Security).
let cloudSaveTimer = null;

let OFFLINE = false;
const DIRTY = () => KEY + ':dirty'; // alteração local ainda não enviada para a nuvem
function cloudSave() {

  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    try {
      const { error } = await sb.from('app_state').upsert({ user_id: authUser.id, blob: JSON.stringify(S), updated_at: new Date().toISOString() });
      if (!error) { try { localStorage.removeItem(DIRTY()); } catch (e) { } if (OFFLINE) { OFFLINE = false; render(); } }
    } catch (e) { }

}
window.addEventListener('online', () => { if (!authUser) return; let d = null; try { d = localStorage.getItem(DIRTY()); } catch (e) { } if (d) cloudSave(); else if (OFFLINE) { OFFLINE = false; render(); } });

  try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && Array.isArray(o.tx)) return migrate(o); } } catch (e) { }

}

    <h3>Não deu para carregar</h3><p class="sub">Confira a internet e tente de novo. Depois do primeiro acesso neste aparelho, o app passa a abrir mesmo sem conexão.</p>

  const t = q.get('tab'); if (t === 'contas') { UI.tab = 'acc'; render(); } else if (t && ['home', 'ext', 'cards', 'pat', 'plan', 'rel'].includes(t)) { UI.tab = t; render(); }

async function startApp(user) {
  authUser = user; KEY = 'cfp:v1:' + user.id;
  document.body.classList.remove('auth');
  let remote = null, failed = false;
  try {
    const { data, error } = await sb.from('app_state').select('blob, updated_at').eq('user_id', user.id).maybeSingle();
    if (error) failed = true; else remote = data;
  } catch (e) { failed = true; }
  const cached = localCache();
  let dirty = null; try { dirty = localStorage.getItem(DIRTY()); } catch (e) { }
  if (failed) {
    // sem internet (ou servidor fora): usa a cópia deste aparelho; nunca trata como conta nova
    if (cached) { S = cached; OFFLINE = true; try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch (e) { } render(); applyUrlShortcut(); return; }
    renderOffline(); return;
  }
  OFFLINE = false;
  if (dirty && cached && !(remote && remote.updated_at && Date.parse(remote.updated_at) > +dirty)) {
    S = cached; cloudSave(); // alterações feitas sem internet que ainda não tinham subido
  } else if (remote && typeof remote.blob === 'string') {
    try { S = migrate(JSON.parse(remote.blob)); } catch (e) { S = migrate(SEED()); }
  } else {
    S = migrate(SEED());
    S.startYm = CUR_YM; S.obPend = 1; // conta nova: começa no mês atual e passa pelo passo a passo
    try { await sb.from('app_state').insert({ user_id: user.id, blob: JSON.stringify(S) }); } catch (e) { }
  }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch (e) { }
  if (S.obPend || (!S.obSeen && !S.gs)) startOnboard(); else { render(); applyUrlShortcut(); }
  alertsBoot();
}

function startOnboard() {

function obPrefill() {

  const isVa = f => f.id === 'f_vavr' || /^va\/vr$/i.test(f.name || '');

const obVal = s => { const n = Core.calc(String(s || '').trim() || '0'); return isNaN(n) ? NaN : n; };

  const inc = Math.max(0, obVal(OB.sal) || 0) + sum(OB.inc, r => Math.max(0, obVal(r.v) || 0)) + (OB.va === true && OB.vaSep === '0' ? Math.max(0, obVal(OB.vaV) || 0) : 0);

  const nm = String(o.name || '').trim(); if (nm) S.profile = Object.assign({}, S.profile, { name: nm });
  const sal = obVal(o.sal); if (sal > 0 && !S.fixed.some(f => f.id === 'f_sal')) add('f_sal', 'Salário', 'in', sal);
  o.inc.forEach(r => { const v = obVal(r.v); if (r.n.trim() && v > 0) add(null, r.n.trim(), 'in', v); });
  const va = o.va === true ? obVal(o.vaV) : 0;
  if (va > 0 && !S.fixed.some(f => f.id === 'f_vavr')) {

    if (o.vaSep === '1') { S.vaSep = true; S.env = [{ id: 'e_vavr', name: 'VA/VR', monthly: Core.round2(va), cats: ['*'], est: false, grp: 'A' }]; } else { S.vaSep = false; S.env = []; }

  o.fix.forEach(r => { const v = obVal(r.v); if (r.n.trim() && v > 0) add(null, r.n.trim(), 'out', v); });

  const initAp = (name, v) => { if (v > 0) S.ap.push({ id: nid('a'), d: TODAY, cx: name, v: Core.round2(v), re: true, ini: true }); }; // como realocação: aumenta a caixinha sem contar como guardado do mês

  else if (st === 'inc' || st === 'fix') err = obCheckRows(st);
  else if (st === 'va') { if (!(obVal(OB.vaV) > 0)) err = 'Digite quanto você recebe de VA/VR por mês.'; }
  else if (st === 'card') { const d = parseInt(OB.closeDay), du = String(OB.dueDay || '').trim(); if (!(d >= 1 && d <= 28)) err = 'Digite um dia de 1 a 28, ou toque em “Não uso cartão de crédito”.'; else if (du && !(+du >= 1 && +du <= 31)) err = 'O vencimento precisa ser um dia de 1 a 31.'; else OB.card = true; }
  else if (st === 'cx') {
    OB.cx = OB.cx.filter(r => r.n.trim() || String(r.v).trim());
    const seen = new Set();
    for (const r of OB.cx) { const k = norm(r.n.trim()); if (!k) { err = 'Dê um nome para cada caixinha ou remova a linha.'; break; } if (seen.has(k)) { err = `Já existe uma caixinha “${r.n.trim()}”.`; break; } seen.add(k); if (isNaN(obVal(r.v))) { err = `Meta de “${r.n.trim()}” inválida.`; break; } }
  }
  else if (st === 'hoje' && OB.ex && OB.card === true && (obVal(OB.fatOpen) || 0) < (OB.fo0 || 0) - 0.005) err = `Pelo que está lançado, a fatura aberta já está em ${brl(OB.fo0)}. Para diminuir, confira as compras na aba Cartões.`;
  else if (st === 'hoje') { if ([OB.accBal, OB.fatOpen, OB.fatClosed, OB.cxHave, ...OB.cx.map(r => r.h)].some(x => isNaN(obVal(x)))) err = 'Confira os valores digitados.'; }
  if (err) { OB.err = err; renderOnboard(); return; }
  if (st === 'hoje') { obApply(); obGo('done'); return; }
  obGo(obNextStep());
};
ACT.obnosal = () => { OB.sal = ''; obGo('inc'); };
ACT.obva = el => { if (el.dataset.v === '1') { OB.va = true; OB.err = ''; renderOnboard('[data-ob="vaV"]'); } else { OB.va = false; obGo('card'); } };
ACT.obvasep = el => { OB.vaSep = el.dataset.v; renderOnboard(); };
ACT.obnova = () => { OB.va = false; OB.vaV = ''; obGo('card'); };
ACT.obnocard = () => { OB.card = false; OB.closeDay = ''; obGo('fix'); };
ACT.obnohoje = () => { OB.accBal = OB.fatOpen = OB.fatClosed = OB.cxHave = ''; OB.cx.forEach(r => { r.h = ''; }); if (OB.ex) OB.fo0 = 0; obApply(); obGo('done'); };
ACT.obacc = el => { OB.accName = OB.accName === el.dataset.n ? '' : el.dataset.n; renderOnboard(); };
ACT.obadd = el => { const k = el.dataset.k, n = el.dataset.n || ''; OB[k].push(k === 'cx' ? { n, v: '', h: '' } : { n, v: '' }); OB.err = ''; const i = OB[k].length - 1; renderOnboard(`[data-ob="${k}.${i}.${n ? 'v' : 'n'}"]`); };
ACT.obdel = el => { const r = OB[el.dataset.k][+el.dataset.i]; if (r && r.id) OB.rm.push(r.id); OB[el.dataset.k].splice(+el.dataset.i, 1); OB.err = ''; renderOnboard(); };
ACT.obcxpct = el => { OB.cxPct = el.dataset.v; renderOnboard(); };
ACT.obend = () => obEnter();

function renderAuth() {
  const up = authMode === 'signup';
  authShell('Seu dinheiro, com calma e clareza.', 'Entradas, saídas, faturas, caixinhas e investimentos num só lugar. Seus dados ficam só na sua conta.', `
      <h3>${up ? 'Criar sua conta' : 'Bem-vindo de volta'}</h3>
      <p class="sub">${up ? 'Leva menos de um minuto.' : 'Entre para ver o seu mês.'}</p>
      ${authErr ? `<div class="auth-err">${esc(authErr)}</div>` : ''}
      <div class="fld"><label class="fl" for="authEmail">E-mail</label><input class="in" id="authEmail" type="email" autocomplete="email" placeholder="voce@email.com" value="${esc(authEmailVal)}"></div>
      <div class="fld"><label class="fl" for="authPass">Senha</label><input class="in" id="authPass" type="password" placeholder="${up ? 'Mínimo de 6 caracteres' : '••••••••'}" autocomplete="${up ? 'new-password' : 'current-password'}"></div>
      <button class="btn primary auth-btn" data-act="authSubmit" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Aguarde…' : (up ? 'Criar conta' : 'Entrar')}</button>
      <button class="btn ghost auth-alt" data-act="authToggle">${up ? 'Já tenho conta' : 'Criar uma conta nova'}</button>
      ${isAndroid() && !isStandalone() ? `<button class="applink" data-act="apkdl">${icon('phone', 16)} Baixar o app para Android</button>` : ''}`);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && (e.target.id === 'authEmail' || e.target.id === 'authPass') && ACT.authSubmit) { e.preventDefault(); ACT.authSubmit(); } });
ACT.authToggle = () => { authMode = authMode === 'signup' ? 'login' : 'signup'; authErr = ''; renderAuth(); };
ACT.authSubmit = async () => {
  const email = ($('authEmail') && $('authEmail').value || '').trim();
  const pass = ($('authPass') && $('authPass').value) || '';
  authEmailVal = email; authErr = '';
  if (!email || !pass) { authErr = 'Preencha e-mail e senha.'; renderAuth(); return; }
  if (pass.length < 6) { authErr = 'A senha precisa ter pelo menos 6 caracteres.'; renderAuth(); return; }
  authBusy = true; renderAuth();
  const call = authMode === 'signup' ? sb.auth.signUp({ email, password: pass }) : sb.auth.signInWithPassword({ email, password: pass });
  const { data, error } = await call;
  authBusy = false;
  if (error) { authErr = error.message; renderAuth(); return; }
  if (authMode === 'signup' && !data.session) { authErr = 'Conta criada! Verifique seu e-mail para confirmar antes de entrar.'; authMode = 'login'; renderAuth(); return; }
  // sessão criada: onAuthStateChange abaixo inicia o app
};
ACT.logout = async () => { try { if ('caches' in window) await caches.delete('cfp-alerts'); } catch (e) { } try { await sb.auth.signOut(); } catch (e) { } };
sb.auth.onAuthStateChange((event, session) => {
  if (session && session.user) {
    if (!authUser || authUser.id !== session.user.id) startApp(session.user);
  } else {
    authUser = null; authMode = 'login'; authErr = '';
    renderAuth();
  }
});

// inicia o app (sempre o último arquivo do bundle)
if (typeof document !== 'undefined' && document.getElementById('seed')) { boot(); }

</script>
